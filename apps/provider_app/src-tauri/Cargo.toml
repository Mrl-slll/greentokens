[package]
name = "greentokens-provider"
version = "0.2.0"
description = "GreenTokens Provider desktop app"
edition = "2021"
rust-version = "1.77"
publish = false

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
serde_json = "1"
sysinfo = { version = "=0.39.5", default-features = false, features = ["system"] }

[profile.release]
strip = true
