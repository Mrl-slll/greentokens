name: Provider app (Windows installer)

on:
  push:
    paths:
      - "apps/provider_app/**"
      - ".github/workflows/provider-app.yml"
  workflow_dispatch:

permissions:
  contents: write # only used to publish the installer to a GitHub release

concurrency:
  group: provider-app-${{ github.ref }}
  cancel-in-progress: true

env:
  RELEASE_TAG: provider-v0.1.0

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/provider_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/provider_app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/provider_app/src-tauri -> target

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build installer
        shell: bash
        run: |
          set +e
          npm run tauri build 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # Surface the failure as annotations so it is readable without opening the raw log.
            grep -n -E "^(error|warning: unused)|-->|Error|failed" build.log | head -30 | while IFS= read -r line; do echo "::error::${line:0:400}"; done
            tail -n 25 build.log | while IFS= read -r line; do echo "::error::tail: ${line:0:400}"; done
          fi
          exit "$code"

      - name: Collect installer
        shell: bash
        run: |
          mkdir -p out
          exe=$(ls src-tauri/target/release/bundle/nsis/*.exe | head -1)
          cp "$exe" out/GreenTokens-Provider-Setup.exe
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: GreenTokens-Provider-Setup
          path: apps/provider_app/out/GreenTokens-Provider-Setup.exe

      - name: Publish public download
        if: github.ref == 'refs/heads/provider-app' || github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete "$RELEASE_TAG" --yes --cleanup-tag || true
          gh release create "$RELEASE_TAG" out/GreenTokens-Provider-Setup.exe \
            --prerelease --target "$GITHUB_SHA" \
            --title "GreenTokens Provider 0.1.0 (demo)" \
            --notes "Demo build of the GreenTokens Provider Windows app. Sign-in, computing and activity are simulated; hardware detection is real. Unsigned: Windows SmartScreen may show 'Windows protected your PC' (choose More info, then Run anyway). Installs for the current user only; no administrator rights needed. Built from ${GITHUB_SHA}."
